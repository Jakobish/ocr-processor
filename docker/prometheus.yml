global:
  scrape_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: ocr
    metrics_path: /metrics
    static_configs:
      - targets: [api:8000]
  - job_name: backup
    static_configs:
      - targets: [backup-metrics:9100]

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
