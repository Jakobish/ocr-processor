x-ocr: &ocr
  build: .
  image: ocr-processor:enterprise
  restart: unless-stopped
  init: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  environment: &ocr-env
    OCR_DATABASE_URL: postgresql+psycopg://ocr:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/ocr
    OCR_STORAGE_ROOT: /app/data
    OCR_IDENTITY_URL: ${OCR_IDENTITY_URL:?Set trusted identity introspection URL}
    OCR_IDENTITY_SECRET: ${OCR_IDENTITY_SECRET:?Set identity server credential}
    OCR_GLOBAL_CONCURRENCY: "2"
    OCR_TENANT_CONCURRENCY: "1"
  volumes: ["ocr_data:/app/data"]
  depends_on:
    migrate: {condition: service_completed_successfully}
  pids_limit: 256
  mem_limit: 2g
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ocr
      POSTGRES_USER: ocr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: ["enterprise_postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ocr -d ocr"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  migrate:
    <<: *ocr
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: {condition: service_healthy}
  api:
    <<: *ocr
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
  worker:
    <<: *ocr
    command: ["python", "-m", "enterprise.worker"]
    mem_limit: 4g
    cpus: 2
    deploy:
      replicas: 2
  maintenance:
    <<: *ocr
    command: ["python", "-m", "enterprise.maintenance"]
  web:
    build: ./web
    environment:
      OCR_API_URL: http://api:8000
      OCR_PUBLIC_ORIGIN: https://${OCR_DOMAIN}
      OCR_LOGIN_URL: ${OCR_LOGIN_URL:-}
      OCR_MEMBERS_URL: ${OCR_MEMBERS_URL:-}
      OCR_IDENTITY_URL: ${OCR_IDENTITY_URL}
      OCR_IDENTITY_SECRET: ${OCR_IDENTITY_SECRET}
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
    init: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
  proxy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment:
      OCR_DOMAIN: ${OCR_DOMAIN:?Set public DNS hostname}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.9.1
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped
  alertmanager:
    image: prom/alertmanager:v0.31.1
    volumes:
      - ./secrets/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    restart: unless-stopped
  backup-metrics:
    image: prom/node-exporter:v1.10.2
    command: ["--collector.disable-defaults", "--collector.textfile", "--collector.textfile.directory=/metrics"]
    volumes: ["./backup-staging/metrics:/metrics:ro"]
    restart: unless-stopped
volumes:
  enterprise_postgres_data:
  ocr_data:
  caddy_data:
  caddy_config:
  prometheus_data:
