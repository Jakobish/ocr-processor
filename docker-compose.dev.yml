# Optional override: docker compose -f docker-compose.yml -f docker-compose.dev.yml up api worker maintenance web
# Only localhost is exposed. Identity checks remain enabled.
services:
  api:
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["./src:/app/src:ro"]
    command: ["uvicorn", "enterprise.api:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--reload"]
  web:
    ports: ["127.0.0.1:3000:3000"]
    environment:
      OCR_PUBLIC_ORIGIN: http://localhost:3000
  postgres:
    ports: ["127.0.0.1:5432:5432"]
  proxy:
    profiles: [production]
  prometheus:
    profiles: [monitoring]
  alertmanager:
    profiles: [monitoring]
  backup-metrics:
    profiles: [monitoring]
